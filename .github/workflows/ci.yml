name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: |
          dotnet test tests/Telepath.Core.Tests/Telepath.Core.Tests.csproj -c Release --nologo
          dotnet test tests/Telepath.SourceGenerator.Tests/Telepath.SourceGenerator.Tests.csproj -c Release --nologo
          dotnet build tests/Telepath.AddonHost/Telepath.AddonHost.csproj -c Release --nologo

      - name: Pack
        run: |
          dotnet pack src/Telepath.Core/Telepath.Core.csproj -c Release --nologo
          dotnet pack src/Telepath.SourceGenerator/Telepath.SourceGenerator.csproj -c Release --nologo
          dotnet pack src/Telepath.Godot/Telepath.Godot.csproj -c Release --nologo
